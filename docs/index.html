<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b1020"><title>Work Time</title><link rel="manifest" href="./manifest.webmanifest"><link rel="stylesheet" href="./style.css"></head><body><main class="app"><header><div class="eyebrow">TODAY</div><h1>Work Time</h1></header><section class="card"><div class="ringStage"><div class="overtimeRing" id="overtimeRing"></div><div class="ring" id="ring"><div class="ringInner"><div id="status" class="status">Not working</div><div id="timer" class="timer">00:00:00</div><div id="hours" class="hours">0.00 / 8 h</div><div id="overtimeLabel" class="overtimeLabel"></div></div></div></div><div class="progressText"><span id="progressLabel">Daily progress</span><strong id="percent">0%</strong></div><button id="startStop"><span class="buttonDot"></span><span id="buttonText">START</span></button></section>
<section class="geo card"><div class="sectionHead"><div><div class="eyebrow">EXPERIMENT</div><h2>Location monitor</h2></div><span id="geoState" class="pill">OFF</span></div><div class="geoGrid"><div><small>Last fix</small><strong id="lastFix">—</strong></div><div><small>Accuracy</small><strong id="accuracy">—</strong></div><div><small>Updates</small><strong id="fixCount">0</strong></div><div><small>Last gap</small><strong id="lastGap">—</strong></div></div><button id="geoToggle" class="secondary">START LOCATION TEST</button><div class="logHead"><span>Event log</span><button id="clearLog" class="tiny">CLEAR</button></div><pre id="geoLog">No events yet.</pre></section>
<p class="version">Version 0.4 · background location experiment</p></main><script src="./app.js"></script></body></html>

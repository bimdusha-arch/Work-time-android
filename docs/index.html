<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b1020"><meta name="apple-mobile-web-app-capable" content="yes"><title>Work Time</title><link rel="manifest" href="./manifest.webmanifest"><link rel="stylesheet" href="./style.css"></head>
<body><main class="app"><header><div class="eyebrow">TODAY</div><h1>Work Time</h1></header><section class="card">
<div class="ringStage"><div class="overtimeRing" id="overtimeRing" style="--overtime:0"></div><div class="ring" id="ring" style="--progress:0"><div class="ringInner"><div id="status" class="status">Not working</div><div id="timer" class="timer">00:00:00</div><div id="hours" class="hours">0.00 / 8 h</div><div id="overtimeLabel" class="overtimeLabel"></div></div></div></div>
<div class="progressText"><span id="progressLabel">Daily progress</span><strong id="percent">0%</strong></div>
<button id="startStop" type="button"><span class="buttonDot"></span><span id="buttonText">START</span></button>
<button id="demoOvertime" class="demo" type="button">PREVIEW 10 HOURS</button>
</section><p class="version">Version 0.3 · overtime ring</p></main><script src="./app.js"></script></body></html>
